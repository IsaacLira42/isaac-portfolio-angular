@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm md:p-8"
    role="presentation"
    (click)="close()"
  >
    <section
      class="relative flex h-[calc(100vh-2rem)] w-full max-w-[96rem] flex-col overflow-hidden rounded-3xl border border-white/10 bg-zinc-950 shadow-2xl md:h-[calc(100vh-4rem)]"
      role="dialog"
      aria-modal="true"
      aria-labelledby="project-modal-title"
      aria-describedby="project-modal-description"
      (click)="$event.stopPropagation()"
    >
      <button
        type="button"
        class="absolute right-4 top-4 z-10 flex h-11 w-11 items-center justify-center rounded-full border border-white/10 bg-black/40 text-white transition-colors hover:bg-white hover:text-black focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
        aria-label="Fechar modal"
        (click)="close()"
      >
        ×
      </button>

      @if (project(); as selectedProject) {
        <div
          class="grid h-full grid-rows-[auto_1fr] gap-0 overflow-hidden lg:grid-cols-[1.15fr_0.85fr] lg:grid-rows-1"
        >
          <div class="relative min-h-[18rem] overflow-hidden bg-zinc-900 lg:min-h-0">
            <img
              [src]="selectedProject.image"
              [alt]="selectedProject.title"
              class="h-full w-full object-cover"
            />
            <div
              class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/15 to-transparent"
            ></div>

            <div class="absolute inset-x-0 bottom-0 p-6 md:p-8 lg:p-10">
              <span class="text-xs font-bold uppercase tracking-[0.35em] text-white/70">
                Projeto selecionado
              </span>
              <h2
                id="project-modal-title"
                class="mt-3 max-w-2xl text-3xl font-black uppercase md:text-5xl"
              >
                {{ selectedProject.title }}
              </h2>
            </div>
          </div>

          <div class="flex h-full flex-col gap-8 overflow-y-auto p-6 md:p-8 lg:p-10">
            <div>
              <span class="text-xs font-bold uppercase tracking-[0.35em] text-primary">
                Detalhes
              </span>
              <p
                id="project-modal-description"
                class="mt-4 text-base leading-7 text-zinc-300 md:text-lg"
              >
                {{ selectedProject.description }}
              </p>
            </div>

            <div>
              <h3 class="text-sm font-semibold uppercase tracking-[0.3em] text-white/60">
                Tecnologias
              </h3>
              <div class="mt-4 flex flex-wrap gap-3">
                @for (tag of selectedProject.tags; track tag) {
                  <span
                    class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-white"
                  >
                    {{ tag }}
                  </span>
                }
              </div>
            </div>
          </div>
        </div>
      }
    </section>
  </div>
}
