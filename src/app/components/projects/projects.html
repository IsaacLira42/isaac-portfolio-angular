<section class="mx-4 sm:mx-8 md:mx-12 lg:mx-20 xl:mx-24 mb-12 md:mb-20 lg:mb-32 overflow-hidden">
  <div class="flex justify-between items-end mb-10">
    <app-sections-titles subtitle="TRABALHOS SELECIONADOS" title="PROJETOS PESSOAIS" />

    <div class="flex gap-4">
      <button
        (click)="scroll('left')"
        class="border-2 border-primary rounded-full w-12 h-12 flex items-center justify-content-center text-primary cursor-pointer transition-colors duration-200 hover:bg-primary hover:text-white"
        aria-label="Anterior"
      >
        <fa-icon [icon]="arrowLeft" class="w-6 h-6 mx-auto"></fa-icon>
      </button>
      <button
        (click)="scroll('right')"
        class="border-2 border-primary rounded-full w-12 h-12 flex items-center justify-content-center text-primary cursor-pointer transition-colors duration-200 hover:bg-primary hover:text-white"
        aria-label="Próximo"
      >
        <fa-icon [icon]="arrowRight" class="w-6 h-6 mx-auto"></fa-icon>
      </button>
    </div>
  </div>

  <div
    #carousel
    class="flex gap-8 overflow-x-auto scroll-smooth pb-4 scrollbar-none [&::-webkit-scrollbar]:hidden"
  >
    @for (project of projects(); track project.title) {
      <button
        type="button"
        class="group flex h-136 w-105 shrink-0 flex-col overflow-hidden rounded-2xl text-left outline-none transition-transform duration-200 hover:-translate-y-1 focus-visible:-translate-y-1 md:h-144"
        (click)="openProject(project)"
      >
        <div class="mb-6 aspect-video shrink-0 overflow-hidden rounded-xl bg-zinc-900">
          <img
            [src]="project.image"
            [alt]="project.title"
            class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105"
          />
        </div>

        <div class="flex min-h-0 flex-1 flex-col">
          <h3 class="line-clamp-1 text-2xl font-bold text-white">{{ project.title }}</h3>
          <p class="mt-3 min-h-18 text-sm leading-relaxed text-zinc-400 line-clamp-3">
            {{ project.description }}
          </p>

          <div class="flex min-h-11 flex-wrap gap-2 pt-6">
            @for (tag of project.tags; track tag) {
              <span class="rounded-full bg-zinc-300 px-5 py-1.5 text-xs font-medium text-zinc-800">
                {{ tag }}
              </span>
            }
          </div>
        </div>
      </button>
    }
  </div>
</section>

<app-modal [open]="isModalOpen()" [project]="selectedProject()" (closed)="closeProject()" />
