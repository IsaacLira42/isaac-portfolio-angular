<div class="flex flex-col items-center w-full h-full">
  <h3 class="text-primary font-extrabold text-xl mb-4 uppercase tracking-wide">
    {{ title() }}
  </h3>

  <div class="relative w-full h-full">
    <div class="absolute top-4 left-4 w-full h-full rounded-xl border-3 border-primary"></div>

    <div
      class="relative z-10 flex flex-row flex-wrap justify-center items-center px-8 py-6 gap-6 rounded-xl bg-white h-full"
    >
      @for (item of technologies(); track item.name) {
        <img
          class="h-12 w-auto object-contain transition-transform hover:scale-110"
          [src]="item.iconUrl"
          [alt]="item.name"
          [title]="item.name"
        />
      }
    </div>
  </div>
</div>
